---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: buluma.apt_repository
      apt_repositories:
        - name: yarn
          uris: https://dl.yarnpkg.com/debian/
          suites: stable
          components: main
          signed_by: https://dl.yarnpkg.com/debian/pubkey.gpg
